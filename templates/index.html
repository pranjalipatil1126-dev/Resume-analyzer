<!DOCTYPE html>
<html>

<head>

    <title>Resume Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Resume Analyzer</h1>

    <p>
        Upload your resume and discover suitable job roles.
    </p>

    <form
        action="/analyze"
        method="POST"
        enctype="multipart/form-data"
    >

        <label>Select Resume</label>

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
